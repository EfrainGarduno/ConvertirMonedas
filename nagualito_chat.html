<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Nagualito</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="chat-container">
        <div id="chat-history">
            <div class="message nagualito-message">¡Hola! Soy Nagualito, tu asistente virtual. ¿En qué puedo ayudarte?</div>
        </div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Escribe tu mensaje..." aria-label="Escribe tu mensaje">
            <button id="send-btn">Enviar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sendBtn = document.getElementById('send-btn');
            const userInput = document.getElementById('user-input');
            const chatHistory = document.getElementById('chat-history');

            function addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(sender === 'user' ? 'user-message' : 'nagualito-message');
                messageDiv.textContent = text;
                chatHistory.appendChild(messageDiv);
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            async function handleSend() {
                const text = userInput.value.trim();
                if (text !== '') {
                    addMessage(text, 'user');
                    userInput.value = '';

                    try {
                        const response = await fetch('/api/chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message: text })
                        });

                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }

                        const data = await response.json();
                        addMessage(data.reply, 'nagualito');
                    } catch (error) {
                        console.error('Error fetching chat response:', error);
                        addMessage('Lo siento, hubo un error al conectar con el servidor.', 'nagualito');
                    }
                }
            }

            sendBtn.addEventListener('click', handleSend);

            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSend();
                }
            });
        });
    </script>
</body>
</html>
